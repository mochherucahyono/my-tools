<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konversi Mata Uang — MyTools</title>
    <link rel="icon" type="image/png" href="../public/my-tools.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&icon-names=arrow_back,construction" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html#tools">
                <span class="material-symbols-outlined fs-6">arrow_back</span>
                <span class="material-symbols-outlined">construction</span> MyTools
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            <i class="fas fa-house"></i> Beranda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="fas fa-info-circle"></i> Tentang
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="service.html">
                            <i class="fas fa-cogs"></i> Layanan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            <i class="fas fa-envelope"></i> Kontak
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Tool Workspace -->
    <main class="tool-workspace flex-grow-1">
        <div class="container">
            <div class="text-center mb-4">
                <div class="badge-pill-soft">
                    <i class="fas fa-coins"></i> Nilai Tukar
                </div>
                <h1 class="h2 hero-title">Konversi Mata Uang</h1>
                <p class="text-muted mb-0">Konversi nominal antar mata uang secara cepat dan praktis.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="tool-box">
                        <div class="mb-3">
                            <label for="amount" class="form-label">Jumlah Uang</label>
                            <input type="number" id="amount" class="form-control" placeholder="Masukkan jumlah uang">
                        </div>

                        <div class="mb-3">
                            <label for="from" class="form-label">Dari</label>
                            <select id="from" class="form-select">
                                <option value="" disabled selected>Pilih mata uang</option>
                                <option value="IDR">IDR (Rupiah)</option>
                                <option value="USD">USD (Dollar)</option>
                                <option value="EUR">EUR (Euro)</option>
                                <option value="KRW">KRW (Won Korea)</option>
                                <option value="JPY">JPY (Yen Jepang)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="to" class="form-label">Ke</label>
                            <select id="to" class="form-select">
                                <option value="" disabled selected>Pilih mata uang</option>
                                <option value="IDR">IDR (Rupiah)</option>
                                <option value="USD">USD (Dollar)</option>
                                <option value="EUR">EUR (Euro)</option>
                                <option value="KRW">KRW (Won Korea)</option>
                                <option value="JPY">JPY (Yen Jepang)</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 mb-4">
                            <button type="button" onclick="convert()" class="btn btn-accent flex-grow-1">
                                <i class="fas fa-right-left me-1"></i> Konversi
                            </button>
                            <button type="button" onclick="resetForm()" class="btn btn-soft-secondary">
                                <i class="fas fa-rotate-left"></i> Reset
                            </button>
                        </div>

                        <div class="result-panel">
                            <div class="small text-muted mb-1">Hasil Konversi</div>
                            <div class="h5 fw-bold mb-0" id="result">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 MyTools. Dibuat oleh Heru Cahyono.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('scrolled', window.scrollY > 10);
        });
    </script>
</body>

</html>
