<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Matematika — MyTools</title>
    <link rel="icon" type="image/png" href="../../public/my-tools.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&icon-names=arrow_back,construction,groups" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/styles.css" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="nav-back-btn" href="../tools.html#tools" data-tooltip="Kembali" aria-label="Kembali ke daftar alat">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <button class="nav-toggler-btn d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" data-tooltip="Menu">
                <span class="nav-toggler-line"></span>
                <span class="nav-toggler-line"></span>
                <span class="nav-toggler-line"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">
                            Beranda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../tools.html">
                            Alat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../about.html">
                            Tentang
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../service.html">
                            Layanan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../contact.html">
                            Kontak
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Tool Workspace -->
    <main class="tool-workspace flex-grow-1">
        <div class="container">
            <div class="text-center mb-4">
                <div class="badge-pill-soft">
                    <i class="fas fa-calculator"></i> Alat Hitung
                </div>
                <h1 class="h2 hero-title">Kalkulator Matematika</h1>
                <p class="text-muted mb-0">Masukkan dua angka lalu pilih operasi aritmetika.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="tool-box">
                        <form id="calcForm">
                            <div class="mb-3">
                                <label for="angka1" class="form-label">Angka Pertama</label>
                                <input type="number" class="form-control" id="angka1" name="angka1" placeholder="0" required>
                            </div>
                            <div class="mb-4">
                                <label for="angka2" class="form-label">Angka Kedua</label>
                                <input type="number" class="form-control" id="angka2" name="angka2" placeholder="0" required>
                            </div>

                            <div class="row row-cols-4 g-2 mb-4">
                                <div class="col">
                                    <button type="button" class="btn btn-op w-100" onclick="hitung('+')" data-tooltip="Tambah">+</button>
                                </div>
                                <div class="col">
                                    <button type="button" class="btn btn-op w-100" onclick="hitung('-')" data-tooltip="Kurang">&minus;</button>
                                </div>
                                <div class="col">
                                    <button type="button" class="btn btn-op w-100" onclick="hitung('*')" data-tooltip="Kali">&times;</button>
                                </div>
                                <div class="col">
                                    <button type="button" class="btn btn-op w-100" onclick="hitung('/')" data-tooltip="Bagi">&divide;</button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="hasil" class="form-label">Hasil</label>
                                <input type="text" class="form-control fw-bold" id="hasil" placeholder="-" readonly style="background-color: var(--bg-surface);">
                            </div>

                            <div class="d-grid">
                                <button type="button" class="btn btn-soft-secondary" onclick="resetCalcForm()">
                                    <i class="fas fa-rotate-left me-1"></i> Reset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <div class="container">
            <div class="footer-inner">
                <p class="mb-0">&copy; 2025 MyTools. Dibuat oleh Heru Cahyono.</p>
                <ul class="footer-nav">
                    <li><a href="../../index.html">Beranda</a></li>
                    <li><a href="../tools.html">Alat</a></li>
                    <li><a href="../about.html">Tentang</a></li>
                    <li><a href="../service.html">Layanan</a></li>
                    <li><a href="../contact.html">Kontak</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/script.js"></script>
    <script>
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('scrolled', window.scrollY > 10);
        });
    </script>
</body>

</html>
